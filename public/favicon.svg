<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 100" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800;900&amp;display=swap');

      .logo-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 900;
        font-size: 64px;
        fill: #111111;
        letter-spacing: -1px;
      }

      .dot {
        fill: #C6EF00; /* Color verde lima característico */
      }
    </style>
  </defs>

  <!-- Texto con llaves y PP -->
  <text x="20" y="70" class="logo-text">{PP}</text>

  <!-- Punto verde lima -->
  <circle cx="195" cy="62" r="11" class="dot" />
</svg>
